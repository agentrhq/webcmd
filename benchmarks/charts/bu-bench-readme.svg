<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="530" viewBox="0 0 1240 530" fill="#151719" role="img" aria-labelledby="title desc">
  <title id="title">BU Bench V1 accuracy, API cost, and agent turns per completed task</title>
  <desc id="desc">webcmd leads with 67 percent accuracy, 25.5 cents per completed task, and 9.8 agent turns per completed task.</desc>
  <style>

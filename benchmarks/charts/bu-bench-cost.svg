<svg xmlns="http://www.w3.org/2000/svg" width="760" height="252" viewBox="0 0 760 252" role="img" aria-labelledby="title desc">
  <title id="title">BU Bench API-equivalent controller cost per completed task</title>
  <desc id="desc">Webcmd cost 25.5 cents per completed task, dev-browser 26.3 cents, browser-use 29.7 cents, Playwright CLI 44.1 cents, and agent-browser 55.4 cents.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #111827; }
    .title { font-size: 17px; font-weight: 700; }
    .note { font-size: 12px; fill: #64748b; }
    .label { font-size: 13px; fill: #475569; }
    .webcmd-label { font-weight: 700; fill: #1d4ed8; }
    .value { font-size: 13px; font-weight: 700; }
    .track { fill: #e2e8f0; }
    .bar { fill: #94a3b8; }
    .webcmd { fill: #2563eb; }
  </style>
  <rect width="760" height="252" fill="#ffffff"/>
  <text class="title" x="24" y="27">API-equivalent cost / task ↓</text>
  <text class="note" x="736" y="27" text-anchor="end">Completed tasks · judge excluded</text>

  <text class="label webcmd-label" x="24" y="82">Webcmd</text>
  <rect class="track" x="150" y="68" width="460" height="18" rx="3"/>
  <rect class="webcmd" x="150" y="68" width="195.5" height="18" rx="3"/>
  <text class="value" x="628" y="82">$0.255</text>

  <text class="label" x="24" y="112">dev-browser</text>
  <rect class="track" x="150" y="98" width="460" height="18" rx="3"/>
  <rect class="bar" x="150" y="98" width="201.6" height="18" rx="3"/>
  <text class="value" x="628" y="112">$0.263</text>

  <text class="label" x="24" y="142">browser-use</text>
  <rect class="track" x="150" y="128" width="460" height="18" rx="3"/>
  <rect class="bar" x="150" y="128" width="227.7" height="18" rx="3"/>
  <text class="value" x="628" y="142">$0.297</text>

  <text class="label" x="24" y="172">Playwright CLI</text>
  <rect class="track" x="150" y="158" width="460" height="18" rx="3"/>
  <rect class="bar" x="150" y="158" width="338.1" height="18" rx="3"/>
  <text class="value" x="628" y="172">$0.441</text>

  <text class="label" x="24" y="202">agent-browser</text>
  <rect class="track" x="150" y="188" width="460" height="18" rx="3"/>
  <rect class="bar" x="150" y="188" width="424.7" height="18" rx="3"/>
  <text class="value" x="628" y="202">$0.554</text>

  <text class="note" x="150" y="232">$0</text>
  <text class="note" x="380" y="232" text-anchor="middle">$0.30</text>
  <text class="note" x="610" y="232" text-anchor="end">$0.60 / task</text>
</svg>

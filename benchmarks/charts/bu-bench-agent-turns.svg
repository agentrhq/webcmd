<svg xmlns="http://www.w3.org/2000/svg" width="760" height="252" viewBox="0 0 760 252" role="img" aria-labelledby="title desc">
  <title id="title">BU Bench agent turns per completed task</title>
  <desc id="desc">Webcmd averaged 9.8 turns per completed task, browser-use 14.8, dev-browser 15.2, Playwright CLI 20.5, and agent-browser 25.5.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #111827; }
    .title { font-size: 17px; font-weight: 700; }
    .note { font-size: 12px; fill: #64748b; }
    .label { font-size: 13px; fill: #475569; }
    .webcmd-label { font-weight: 700; fill: #1d4ed8; }
    .value { font-size: 13px; font-weight: 700; }
    .track { fill: #e2e8f0; }
    .bar { fill: #94a3b8; }
    .webcmd { fill: #2563eb; }
  </style>
  <rect width="760" height="252" fill="#ffffff"/>
  <text class="title" x="24" y="27">Agent turns / task ↓</text>
  <text class="note" x="736" y="27" text-anchor="end">Lower is better · completed tasks</text>

  <text class="label webcmd-label" x="24" y="82">Webcmd</text>
  <rect class="track" x="150" y="68" width="460" height="18" rx="3"/>
  <rect class="webcmd" x="150" y="68" width="173.4" height="18" rx="3"/>
  <text class="value" x="628" y="82">9.8</text>

  <text class="label" x="24" y="112">browser-use</text>
  <rect class="track" x="150" y="98" width="460" height="18" rx="3"/>
  <rect class="bar" x="150" y="98" width="261.8" height="18" rx="3"/>
  <text class="value" x="628" y="112">14.8</text>

  <text class="label" x="24" y="142">dev-browser</text>
  <rect class="track" x="150" y="128" width="460" height="18" rx="3"/>
  <rect class="bar" x="150" y="128" width="268.9" height="18" rx="3"/>
  <text class="value" x="628" y="142">15.2</text>

  <text class="label" x="24" y="172">Playwright CLI</text>
  <rect class="track" x="150" y="158" width="460" height="18" rx="3"/>
  <rect class="bar" x="150" y="158" width="362.7" height="18" rx="3"/>
  <text class="value" x="628" y="172">20.5</text>

  <text class="label" x="24" y="202">agent-browser</text>
  <rect class="track" x="150" y="188" width="460" height="18" rx="3"/>
  <rect class="bar" x="150" y="188" width="451.2" height="18" rx="3"/>
  <text class="value" x="628" y="202">25.5</text>

  <text class="note" x="150" y="232">0</text>
  <text class="note" x="380" y="232" text-anchor="middle">13</text>
  <text class="note" x="610" y="232" text-anchor="end">26 turns / task</text>
</svg>

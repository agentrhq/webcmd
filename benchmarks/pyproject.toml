[project]
name = "browser-bench-eval"
version = "0.1.0"
description = "Run browser tools on controlled browser benchmarks"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "google-genai>=1,<2",
  "pydantic>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
